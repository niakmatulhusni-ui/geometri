<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Geometri Kelas 6</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #6a11cb;
    --primary2: #2575fc;
    --accent: #ff9f1c;
    --accent2: #ffbf69;
    --success: #2bb673;
    --success-bg: #e3f9ec;
    --wrong: #e74c3c;
    --wrong-bg: #fdecea;
    --warn: #f4b400;
    --ink: #2d2d44;
    --muted: #6b7280;
  }
  body {
    font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--ink);
  }
  #app { width: 100%; max-width: 740px; }
  .screen { display: none; animation: fadeIn .45s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .card {
    background: #ffffff;
    border-radius: 28px;
    padding: 30px 26px;
    box-shadow: 0 22px 55px rgba(0,0,0,.28);
  }
  .mascot { font-size: 64px; text-align: center; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  .title { text-align: center; font-size: 26px; font-weight: 800; color: var(--primary); margin-top: 6px; }
  .subtitle { text-align: center; color: var(--muted); margin-top: 6px; font-size: 15px; }

  .field { margin-top: 18px; }
  .field label { display: block; font-weight: 700; color: var(--ink); margin-bottom: 6px; font-size: 15px; }
  .field input, .field select {
    width: 100%;
    padding: 13px 16px;
    border: 2px solid #e3e6f0;
    border-radius: 14px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus { border-color: var(--primary2); box-shadow: 0 0 0 4px rgba(37,117,252,.15); }

  .btn {
    display: inline-block;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 800;
    border-radius: 16px;
    padding: 14px 26px;
    font-size: 16px;
    transition: transform .12s, box-shadow .2s, opacity .2s;
    text-align: center;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #5a3400; box-shadow: 0 8px 18px rgba(255,159,28,.35); }
  .btn-primary:hover { box-shadow: 0 11px 24px rgba(255,159,28,.45); }
  .btn-next { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; box-shadow: 0 8px 18px rgba(37,117,252,.35); }
  .btn-next:hover { box-shadow: 0 11px 24px rgba(37,117,252,.45); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-ghost { background: #eef0fb; color: var(--primary); }
  .row { display: flex; gap: 12px; margin-top: 22px; }
  .row .btn { flex: 1; }

  /* Progress */
  .progress-wrap { margin-bottom: 18px; }
  .progress-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #fff; font-weight: 700; margin-bottom: 8px; }
  .progress-bar { background: rgba(255,255,255,.25); border-radius: 99px; height: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #ffd200, #ff9f1c); border-radius: 99px; width: 0%; transition: width .4s ease; }

  .qbadge { display: inline-flex; align-items: center; gap: 6px; background: #eef0fb; color: var(--primary); font-weight: 800; padding: 6px 14px; border-radius: 99px; font-size: 13px; }
  .qtype-tag { background: #fff4e0; color: #b06a00; }
  .qtext { font-size: 19px; font-weight: 700; margin: 14px 0 6px; line-height: 1.45; }
  .qhint { background: #f3f6ff; border-left: 4px solid var(--primary2); padding: 10px 14px; border-radius: 10px; font-size: 14px; color: #444b6b; margin: 12px 0; }
  .qhint b { color: var(--primary); }

  /* Options */
  .options { display: grid; gap: 12px; margin-top: 14px; }
  .option {
    background: #f7f8fd;
    border: 2px solid #e3e6f0;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 16px;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: inherit;
    text-align: left;
    color: var(--ink);
  }
  .option:hover { border-color: var(--primary2); background: #eef3ff; }
  .option .key { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 2px solid #d7dcea; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--primary); flex-shrink: 0; }
  .option.selected { border-color: var(--primary); background: #e9edff; }
  .option.selected .key { background: var(--primary); color: #fff; border-color: var(--primary); }
  .option.disabled { cursor: default; opacity: .6; }
  .option.correct-opt { border-color: var(--success); background: var(--success-bg); }
  .option.correct-opt .key { background: var(--success); color: #fff; border-color: var(--success); }
  .option.wrong-opt { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.wrong-opt .key { background: var(--wrong); color: #fff; border-color: var(--wrong); }

  /* TF */
  .tf-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .tf-btn {
    border: 2px solid #e3e6f0;
    background: #f7f8fd;
    border-radius: 16px;
    padding: 22px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .tf-btn:hover { border-color: var(--primary2); background: #eef3ff; }
  .tf-btn.selected { border-color: var(--primary); background: #e9edff; color: var(--primary); }
  .tf-btn.correct-opt { border-color: var(--success); background: var(--success-bg); color: var(--success); }
  .tf-btn.wrong-opt { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }

  /* Input answer */
  .input-wrap { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .input-wrap input {
    flex: 1; padding: 14px 16px; border: 2px solid #e3e6f0; border-radius: 14px;
    font-size: 18px; font-family: inherit; outline: none;
  }
  .input-wrap input:focus { border-color: var(--primary2); box-shadow: 0 0 0 4px rgba(37,117,252,.15); }
  .unit-chip { background: #eef0fb; color: var(--primary); font-weight: 800; padding: 14px 16px; border-radius: 14px; font-size: 16px; white-space: nowrap; }

  /* Feedback */
  .feedback { margin-top: 18px; border-radius: 16px; padding: 16px 18px; display: none; animation: pop .35s ease; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--success-bg); border: 2px solid var(--success); }
  .feedback.no { background: var(--wrong-bg); border: 2px solid var(--wrong); }
  .feedback.info { background: #eef3ff; border: 2px solid var(--primary2); }
  .feedback .fb-head { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .feedback.ok .fb-head { color: var(--success); }
  .feedback.no .fb-head { color: var(--wrong); }
  .feedback.info .fb-head { color: var(--primary); }
  .feedback .fb-body { margin-top: 6px; font-size: 14.5px; line-height: 1.5; color: #3a3f5c; }
  .feedback .fb-body b { color: var(--ink); }

  .attempt-dots { display: flex; gap: 6px; margin-top: 12px; justify-content: center; }
  .attempt-dots .dot { width: 12px; height: 12px; border-radius: 50%; background: #d7dcea; }
  .attempt-dots .dot.used { background: var(--warn); }
  .attempt-dots .dot.done { background: var(--success); }

  .identity-preview { background: #f3f6ff; border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #444b6b; }
  .identity-preview b { color: var(--primary); }

  /* Result */
  .score-ring { width: 150px; height: 150px; margin: 6px auto 0; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p)*1%), #eef0fb 0); display: flex; align-items: center; justify-content: center; }
  .score-ring .inner { width: 116px; height: 116px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-ring .num { font-size: 34px; font-weight: 800; color: var(--primary); }
  .score-ring .lbl { font-size: 12px; color: var(--muted); }
  .medal { text-align: center; font-size: 60px; margin-top: 8px; }
  .result-msg { text-align: center; font-size: 17px; font-weight: 700; margin: 6px 0 4px; color: var(--ink); }
  .breakdown { margin-top: 18px; border-radius: 14px; overflow: hidden; border: 1px solid #e3e6f0; }
  .breakdown table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .breakdown th { background: #f3f6ff; color: var(--primary); padding: 10px 12px; text-align: left; font-weight: 800; }
  .breakdown td { padding: 9px 12px; border-top: 1px solid #eef0fb; }
  .breakdown tr:nth-child(even) td { background: #fafbff; }
  .pill { padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 800; }
  .pill.ok1 { background: var(--success-bg); color: var(--success); }
  .pill.ok2 { background: #fff4e0; color: #b06a00; }
  .pill.help { background: #f0f1f5; color: var(--muted); }

  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
  .center { text-align: center; }
  .small-note { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 14px; }

  @media (max-width: 480px) {
    .card { padding: 22px 18px; }
    .title { font-size: 22px; }
    .qtext { font-size: 17px; }
    .tf-wrap { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== LAYAR IDENTITAS ===== -->
  <div id="screen-identity" class="screen active">
    <div class="card">
      <div class="mascot">🦉</div>
      <div class="title">Petualangan Geometri</div>
      <div class="subtitle">Kuis seru bangun datar untuk kelas 6 SD 🚀</div>

      <div class="field">
        <label for="in-name">Nama Lengkap</label>
        <input id="in-name" type="text" placeholder="Tulis namamu di sini..." autocomplete="off">
      </div>
      <div class="field">
        <label for="in-class">Kelas</label>
        <input id="in-class" type="text" placeholder="Contoh: 6A" autocomplete="off" list="class-list">
        <datalist id="class-list">
          <option value="6A"><option value="6B"><option value="6C"><option value="6D"><option value="6E"><option value="6F">
        </datalist>
      </div>

      <div class="row">
        <button id="btn-start" class="btn btn-primary" disabled>Mulai Petualangan →</button>
      </div>

      <div class="small-note">
        📌 Ada 10 soal. Jawab dengan cara yang berbeda-beda: menulis angka, memilih jawaban, dan menentukan Benar/Salah.<br>
        Kalau salah, kamu boleh mencoba <b>1 kali lagi</b>. Selesaikan dulu soal yang sedang dijawab, baru bisa lanjut. 💪
      </div>
    </div>
  </div>

  <!-- ===== LAYAR KUIS ===== -->
  <div id="screen-quiz" class="screen">
    <div class="progress-wrap">
      <div class="progress-top">
        <span id="prog-label">Soal 1 dari 10</span>
        <span id="prog-name"></span>
      </div>
      <div class="progress-bar"><div id="prog-fill" class="progress-fill"></div></div>
    </div>
    <div class="card" id="quiz-card"><!-- diisi oleh JS --></div>
  </div>

  <!-- ===== LAYAR HASIL ===== -->
  <div id="screen-result" class="screen">
    <div class="card" id="result-card"><!-- diisi oleh JS --></div>
  </div>

</div>
<canvas id="confetti-canvas"></canvas>

<script>
/* ============ DATA SOAL ============ */
const QUESTIONS = [
  {
    n: 1, type: "input", tag: "Isian Angka",
    text: "Sebuah persegi memiliki luas 225 cm². Hitunglah panjang sisinya.",
    unit: "cm", answer: 15,
    hint: "Luas persegi = sisi × sisi. Cari sebuah angka yang bila dikalikan dengan dirinya sendiri hasilnya 225.",
    explain: "Karena 15 × 15 = 225, maka sisi persegi tersebut = <b>15 cm</b>."
  },
  {
    n: 2, type: "mc", tag: "Pilihan Ganda",
    text: "Keliling sebuah persegi panjang adalah 60 cm. Jika lebarnya 10 cm, berapakah panjangnya?",
    options: ["15 cm", "20 cm", "25 cm", "30 cm"], correctIndex: 1,
    hint: "Keliling = 2 × (panjang + lebar). Bagi keliling dengan 2, lalu kurangi lebar.",
    explain: "60 = 2 × (p + 10) → p + 10 = 30 → p = <b>20 cm</b>."
  },
  {
    n: 3, type: "input", tag: "Isian Angka",
    text: "Luas sebuah segitiga adalah 48 cm² dengan tinggi 12 cm. Berapakah alasnya?",
    unit: "cm", answer: 8,
    hint: "Luas segitiga = ½ × alas × tinggi. Maka alas = (2 × luas) ÷ tinggi.",
    explain: "alas = (2 × 48) ÷ 12 = 96 ÷ 12 = <b>8 cm</b>."
  },
  {
    n: 4, type: "input", tag: "Isian Angka",
    text: "Sebuah lingkaran memiliki keliling 44 cm. Tentukan jari-jarinya (π = 22/7).",
    unit: "cm", answer: 7,
    hint: "Keliling = 2 × π × r. Maka r = keliling ÷ (2 × π).",
    explain: "r = 44 ÷ (2 × 22/7) = 44 × 7 ÷ 44 = <b>7 cm</b>."
  },
  {
    n: 5, type: "mc", tag: "Pilihan Ganda",
    text: "Luas trapesium adalah 150 cm². Jika tinggi 10 cm dan salah satu sisi sejajar 12 cm, berapakah panjang sisi sejajar yang lainnya?",
    options: ["15 cm", "18 cm", "20 cm", "24 cm"], correctIndex: 1,
    hint: "Luas = ½ × (jumlah sisi sejajar) × tinggi. Kalikan luas dengan 2, bagi tinggi, lalu kurangi sisi yang diketahui.",
    explain: "150 = ½ × (12 + s) × 10 → 12 + s = 30 → s = <b>18 cm</b>."
  },
  {
    n: 6, type: "input", tag: "Isian Angka",
    text: "Sebuah belah ketupat memiliki luas 96 cm². Jika panjang salah satu diagonalnya 12 cm, berapakah panjang diagonal yang lain?",
    unit: "cm", answer: 16,
    hint: "Luas belah ketupat = ½ × d₁ × d₂. Maka d₂ = (2 × luas) ÷ d₁.",
    explain: "d₂ = (2 × 96) ÷ 12 = 192 ÷ 12 = <b>16 cm</b>."
  },
  {
    n: 7, type: "input", tag: "Isian Angka (2 Langkah)",
    text: "Keliling sebuah lingkaran adalah 132 cm. Hitunglah luas lingkaran tersebut. (Petunjuk: cari jari-jari r lebih dulu, π = 22/7)",
    unit: "cm²", answer: 1386,
    hint: "Pecah menjadi dua langkah. Langkah 1: cari r dengan rumus keliling lingkaran (K = 2 × π × r). Langkah 2: setelah r diketahui, hitung luas dengan rumus luas lingkaran.",
    explain: "r = 132 × 7 ÷ 44 = 21 cm. Luas = 22/7 × 21 × 21 = 22 × 63 = <b>1386 cm²</b>."
  },
  {
    n: 8, type: "mc", tag: "Pilihan Ganda (Dua Langkah)",
    text: "Sebuah taman berbentuk persegi panjang berukuran 28 m × 22 m. Di dalamnya terdapat kolam berbentuk lingkaran dengan jari-jari 7 m (π = 22/7). Berapakah luas taman yang tidak ditutupi kolam?",
    options: ["308 m²", "462 m²", "594 m²", "770 m²"],
    correctIndex: 1,
    hint: "Soal ini dua langkah. Langkah 1: hitung luas seluruh taman (persegi panjang). Langkah 2: hitung luas kolam (lingkaran). Luas yang ditanya = luas taman − luas kolam.",
    explain: "Luas taman = 28 × 22 = 616 m². Luas kolam = 22/7 × 7 × 7 = 154 m². Luas yang tidak ditutupi = 616 − 154 = <b>462 m²</b>."
  },
  {
    n: 9, type: "tf", tag: "Benar / Salah",
    text: "Pernyataan: Dua buah persegi memiliki perbandingan luas 1 : 4. Jika sisi persegi kecil adalah 5 cm, maka keliling persegi yang besar adalah 40 cm.",
    correctTF: true,
    hint: "Perbandingan luas 1 : 4 berarti luas persegi yang besar = 4 kali luas persegi yang kecil. Karena luas persegi = sisi × sisi, pikirkan: sisi berapa yang bila dikalikan dengan dirinya sendiri hasilnya 4? Itulah kelipatan sisinya. Setelah dapat sisi persegi besar, keliling = 4 × sisi.",
    explain: "Sisi kecil = 5 cm → sisi besar = 10 cm. Keliling besar = 4 × 10 = 40 cm. Jadi pernyataan <b>BENAR</b>."
  },
  {
    n: 10, type: "mc", tag: "Pilihan Ganda (Skala)",
    text: "Sebuah foto berukuran panjang 20 cm dan lebar 12 cm diperbesar sehingga panjangnya menjadi 30 cm. Berapakah lebar foto setelah diperbesar?",
    options: ["12 cm", "18 cm", "24 cm", "30 cm"],
    correctIndex: 1,
    hint: "Karena bangun tetap sebangun, bandingkan panjang lama dan panjang baru untuk memperoleh skala perbesaran. Lalu kalikan lebar lama dengan skala tersebut untuk mendapatkan lebar baru.",
    explain: "Skala = panjang baru ÷ panjang lama = 30 ÷ 20 = 1,5. Lebar baru = 12 × 1,5 = <b>18 cm</b>. (Cek: 20 : 12 = 30 : 18, perbandingannya sama.)"
  }
];

/* ============ PESAN PENGUATAN ============ */
const MSG = {
  ok1: ["Hebat! Jawabanmu tepat sekali! 🎉", "Luar biasa! Kamu pintar! ⭐", "Mantap! Jawaban benar! 🌟", "Keren sekali! Kamu menjawab dengan tepat! 🏆", "Pintar banget! Lanjutkan! 🚀"],
  ok2: ["Bagus! Kamu berhasil setelah mencoba lagi! 👍", "Tetap semangat! Kamu akhirnya menemukannya! 💪", "Kerja bagus! Tak mudah menyerah, kan? 🎯", "Sip! Kamu belajar dari kesalahanmu! 🌟"],
  no1: ["Belum tepat, jangan menyerah ya! Coba lihat petunjuk dan jawab lagi. 💪", "Hampir! Periksa kembali perhitunganmu. Coba sekali lagi! ✏️", "Belum benar, tapi tidak apa-apa! Ayo coba lagi! 🌱", "Sabar ya, setiap jagoan matematika pernah salah. Coba lagi! 🤔"],
  no2: ["Jangan khawatir, belajar dari kesalahan itu bagus! Inilah jawaban yang benar. 📚", "Tidak apa-apa, ini kesempatan belajar. Pelajari jawaban berikut ya! 💡", "Lumayan susah memang. Mari kita bahas jawaban benarnya bersama-sama! 🤝"]
};
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ============ STATE ============ */
const state = {
  name: "", kelas: "",
  idx: 0,
  results: [] // {status: 'ok1'|'ok2'|'help', points, attempts}
};

/* ============ ELEMEN ============ */
const $ = id => document.getElementById(id);
const elIdentity = $("screen-identity"), elQuiz = $("screen-quiz"), elResult = $("screen-result");

/* ============ IDENTITAS ============ */
const inName = $("in-name"), inClass = $("in-class"), btnStart = $("btn-start");
function checkStart() { btnStart.disabled = !(inName.value.trim() && inClass.value.trim()); }
inName.addEventListener("input", checkStart);
inClass.addEventListener("input", checkStart);
inName.addEventListener("keydown", e => { if (e.key === "Enter") inClass.focus(); });
inClass.addEventListener("keydown", e => { if (e.key === "Enter" && !btnStart.disabled) startQuiz(); });
btnStart.addEventListener("click", startQuiz);

function startQuiz() {
  state.name = inName.value.trim();
  state.kelas = inClass.value.trim();
  state.idx = 0;
  state.results = [];
  $("prog-name").textContent = "👤 " + state.name + " • " + state.kelas;
  show(elQuiz);
  renderQuestion();
}

function show(screen) {
  [elIdentity, elQuiz, elResult].forEach(s => s.classList.remove("active"));
  screen.classList.add("active");
}

/* ============ RENDER SOAL ============ */
let qState = null; // {attempt:1|2, resolved:false, type, selected...}

function renderQuestion() {
  const q = QUESTIONS[state.idx];
  qState = { attempt: 1, resolved: false };

  // progress
  const total = QUESTIONS.length;
  const done = state.idx; // soal yang sudah selesai
  $("prog-label").textContent = "Soal " + (state.idx + 1) + " dari " + total;
  $("prog-fill").style.width = (done / total * 100) + "%";

  const card = $("quiz-card");
  let html = '';
  html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">';
  html += '<span class="qbadge">Soal ' + q.n + '</span>';
  html += '<span class="qbadge qtype-tag">' + q.tag + '</span>';
  html += '</div>';
  html += '<div class="qtext">' + q.text + '</div>';
  html += '<div class="qhint">💡 <b>Petunjuk:</b> ' + q.hint + '</div>';

  if (q.type === "input") {
    html += '<div class="input-wrap">';
    html += '<input id="ans-input" type="text" inputmode="decimal" placeholder="Tulis jawaban (angka saja)" autocomplete="off">';
    html += '<span class="unit-chip">' + q.unit + '</span>';
    html += '</div>';
  } else if (q.type === "mc") {
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      html += '<button class="option" data-i="' + i + '"><span class="key">' + String.fromCharCode(65 + i) + '</span><span>' + opt + '</span></button>';
    });
    html += '</div>';
  } else if (q.type === "tf") {
    html += '<div class="tf-wrap">';
    html += '<button class="tf-btn" data-v="true">✅ BENAR</button>';
    html += '<button class="tf-btn" data-v="false">❌ SALAH</button>';
    html += '</div>';
  }

  html += '<div class="attempt-dots" title="Kesempatan menjawab"><span class="dot" id="d1"></span><span class="dot" id="d2"></span></div>';
  html += '<div id="feedback" class="feedback"></div>';
  html += '<div class="row" id="action-row"><button id="btn-check" class="btn btn-primary">Periksa Jawaban</button></div>';

  card.innerHTML = html;

  // bind events
  if (q.type === "input") {
    const inp = $("ans-input");
    inp.focus();
    inp.addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
  } else if (q.type === "mc") {
    card.querySelectorAll(".option").forEach(b => {
      b.addEventListener("click", () => {
        if (qState.resolved) return;
        card.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        b.classList.add("selected");
        b.dataset.chosen = "1";
      });
    });
  } else if (q.type === "tf") {
    card.querySelectorAll(".tf-btn").forEach(b => {
      b.addEventListener("click", () => {
        if (qState.resolved) return;
        card.querySelectorAll(".tf-btn").forEach(o => o.classList.remove("selected"));
        b.classList.add("selected");
      });
    });
  }
  $("btn-check").addEventListener("click", doCheck);
  updateDots();
}

function updateDots() {
  const d1 = $("d1"), d2 = $("d2");
  if (!d1 || !d2) return;
  d1.className = "dot"; d2.className = "dot";
  if (qState.attempt >= 2) d1.classList.add("used");
  if (qState.resolved) { d1.classList.add("done"); d2.classList.add("done"); }
}

/* ============ CEK JAWABAN ============ */
function getUserAnswer() {
  const q = QUESTIONS[state.idx];
  const card = $("quiz-card");
  if (q.type === "input") {
    return { value: $("ans-input").value };
  } else if (q.type === "mc") {
    const sel = card.querySelector(".option.selected");
    return { index: sel ? parseInt(sel.dataset.i) : null };
  } else if (q.type === "tf") {
    const sel = card.querySelector(".tf-btn.selected");
    return { tf: sel ? (sel.dataset.v === "true") : null };
  }
}

function isCorrect(ans) {
  const q = QUESTIONS[state.idx];
  if (q.type === "input") {
    const cleaned = String(ans.value).replace(/[^0-9.,]/g, "").replace(",", ".");
    const num = parseFloat(cleaned);
    return !isNaN(num) && Math.abs(num - q.answer) < 0.01;
  } else if (q.type === "mc") {
    return ans.index === q.correctIndex;
  } else if (q.type === "tf") {
    return ans.tf === q.correctTF;
  }
  return false;
}

function doCheck() {
  if (qState.resolved) return;
  const q = QUESTIONS[state.idx];
  const ans = getUserAnswer();

  // validasi: pastikan sudah mengisi
  if (q.type === "input" && !String(ans.value).trim()) { flashFeedback("info", "Eits, isi dulu jawabanmu ya! ✏️", ""); return; }
  if (q.type === "mc" && ans.index === null) { flashFeedback("info", "Pilih salah satu jawaban dulu ya! 🤔", ""); return; }
  if (q.type === "tf" && ans.tf === null) { flashFeedback("info", "Pilih BENAR atau SALAH dulu ya! 👀", ""); return; }

  const correct = isCorrect(ans);

  if (correct) {
    const status = (qState.attempt === 1) ? "ok1" : "ok2";
    const pts = (status === "ok1") ? 10 : 5;
    state.results[state.idx] = { status, points: pts, attempts: qState.attempt };
    qState.resolved = true;
    lockQuestion(true);
    if (status === "ok1") launchConfetti();
    showFeedback("ok", pick(MSG.ok1), "Pembahasan: " + q.explain);
    updateDots();
    showNextButton();
  } else {
    if (qState.attempt === 1) {
      qState.attempt = 2;
      updateDots();
      showFeedback("no", pick(MSG.no1), "Coba periksa <b>petunjuk</b> di atas dan kerjakan kembali. Masih ada 1 kesempatan lagi! 💪");
      // reset pilihan supaya siswa menjawab ulang
      resetSelections();
    } else {
      // percobaan kedua masih salah -> bahas bersama, lanjut
      state.results[state.idx] = { status: "help", points: 0, attempts: 2 };
      qState.resolved = true;
      lockQuestion(true);
      revealCorrect();
      showFeedback("info", pick(MSG.no2), "Jawaban yang benar: " + q.explain);
      updateDots();
      showNextButton();
    }
  }
}

function resetSelections() {
  const card = $("quiz-card");
  card.querySelectorAll(".option").forEach(o => { o.classList.remove("selected"); });
  card.querySelectorAll(".tf-btn").forEach(o => o.classList.remove("selected"));
  const inp = $("ans-input");
  if (inp) { inp.value = ""; inp.focus(); }
}

function lockQuestion(lock) {
  const card = $("quiz-card");
  card.querySelectorAll(".option, .tf-btn").forEach(b => { if (lock) b.classList.add("disabled"); });
  const inp = $("ans-input");
  if (inp) inp.disabled = lock;
  const btn = $("btn-check");
  if (btn) btn.style.display = "none";
}

function revealCorrect() {
  const q = QUESTIONS[state.idx];
  const card = $("quiz-card");
  if (q.type === "mc") {
    card.querySelectorAll(".option").forEach(o => {
      const i = parseInt(o.dataset.i);
      if (i === q.correctIndex) o.classList.add("correct-opt");
    });
  } else if (q.type === "tf") {
    card.querySelectorAll(".tf-btn").forEach(o => {
      const v = o.dataset.v === "true";
      if (v === q.correctTF) o.classList.add("correct-opt");
    });
  }
}

function flashFeedback(type, head, body) {
  showFeedback(type, head, body);
}

function showFeedback(type, head, body) {
  const fb = $("feedback");
  fb.className = "feedback show " + type;
  fb.innerHTML = '<div class="fb-head">' + head + '</div>' + (body ? '<div class="fb-body">' + body + '</div>' : '');
}

function showNextButton() {
  const row = $("action-row");
  const isLast = state.idx === QUESTIONS.length - 1;
  row.innerHTML = '<button id="btn-next" class="btn btn-next">' + (isLast ? "Lihat Hasil Akhir 🏁" : "Soal Berikutnya →") + '</button>';
  $("btn-next").addEventListener("click", nextQuestion);
  $("btn-next").focus();
}

function nextQuestion() {
  if (state.idx < QUESTIONS.length - 1) {
    state.idx++;
    renderQuestion();
  } else {
    showResults();
  }
}

/* ============ HASIL ============ */
function showResults() {
  const total = state.results.reduce((s, r) => s + (r ? r.points : 0), 0);
  const max = QUESTIONS.length * 10;
  const pct = Math.round(total / max * 100);

  let medal, msg;
  if (pct >= 90) { medal = "🏆"; msg = "Luar biasa, " + state.name + "! Kamu jagoan geometri!"; }
  else if (pct >= 75) { medal = "🥇"; msg = "Kerja hebat, " + state.name + "! Terus berlatih ya!"; }
  else if (pct >= 60) { medal = "🥈"; msg = "Bagus, " + state.name + "! Kamu sudah cukup baik, semangat terus!"; }
  else if (pct >= 40) { medal = "🥉"; msg = "Lumayan, " + state.name + "! Ayo terus berlatih, kamu pasti bisa!"; }
  else { medal = "🌱"; msg = "Jangan menyerah, " + state.name + "! Setiap kesalahan adalah langkah menuju paham. Coba lagi ya!"; }

  let rows = "";
  QUESTIONS.forEach((q, i) => {
    const r = state.results[i] || { status: "help", points: 0 };
    let pill, label;
    if (r.status === "ok1") { pill = "pill ok1"; label = "✓ Benar (langsung)"; }
    else if (r.status === "ok2") { pill = "pill ok2"; label = "✓ Benar (coba ke-2)"; }
    else { pill = "pill help"; label = "• Dibahas bersama"; }
    rows += '<tr><td>Soal ' + q.n + '</td><td>' + q.tag + '</td><td><span class="' + pill + '">' + label + '</span></td><td style="text-align:right;font-weight:800;">' + r.points + '</td></tr>';
  });

  const html =
    '<div class="medal">' + medal + '</div>' +
    '<div class="result-msg">' + msg + '</div>' +
    '<div class="identity-preview" style="margin:14px 0;"><span>👤 ' + escapeHtml(state.name) + '</span><span>🏫 Kelas ' + escapeHtml(state.kelas) + '</span></div>' +
    '<div class="score-ring" style="--p:' + pct + '"><div class="inner"><div class="num">' + total + '/' + max + '</div><div class="lbl">' + pct + '% benar mandiri</div></div></div>' +
    '<div class="breakdown"><table><thead><tr><th>Soal</th><th>Tipe</th><th>Hasil</th><th style="text-align:right;">Poin</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="row"><button id="btn-restart" class="btn btn-primary">🔁 Ulangi Kuis</button></div>' +
    '<div class="small-note">Catatan: poin penuh (10) jika benar langsung, setengah (5) jika benar pada percobaan kedua, dan 0 jika dibahas bersama. Tetap semangat belajar! 📚</div>';

  $("result-card").innerHTML = html;
  show(elResult);
  if (pct >= 75) launchConfetti();
  $("btn-restart").addEventListener("click", restart);
}

function restart() {
  state.idx = 0;
  state.results = [];
  inName.value = state.name;
  inClass.value = state.kelas;
  show(elQuiz);
  renderQuestion();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ============ KONFETI ============ */
const cvs = $("confetti-canvas");
const ctx = cvs.getContext("2d");
function resizeC() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
window.addEventListener("resize", resizeC); resizeC();

let confettiRunning = false;
function launchConfetti() {
  if (confettiRunning) return;
  confettiRunning = true;
  const colors = ["#FF6B6B", "#4ECDC4", "#FFE66D", "#95E1D3", "#FF9F1C", "#6BCB77", "#C780FA"];
  const pieces = [];
  for (let i = 0; i < 130; i++) {
    pieces.push({
      x: Math.random() * cvs.width,
      y: -20 - Math.random() * cvs.height * 0.5,
      r: 5 + Math.random() * 7,
      c: colors[Math.floor(Math.random() * colors.length)],
      vx: -2 + Math.random() * 4,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * Math.PI,
      vr: -0.2 + Math.random() * 0.4
    });
  }
  let frame = 0;
  function animate() {
    frame++;
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.05;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.5);
      ctx.restore();
    });
    if (frame < 200) { requestAnimationFrame(animate); }
    else { ctx.clearRect(0, 0, cvs.width, cvs.height); confettiRunning = false; }
  }
  animate();
}

/* init */
checkStart();
</script>
